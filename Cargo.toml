[workspace]
resolver = "2"
members = ["warden-core", "warden-app", "warden-tauri/src-tauri"]
default-members = ["warden-app"]
exclude = ["warden-tauri/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Fakeonomics/Warden"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
base64 = "0.22"
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
parking_lot = "0.12"
ring = "0.17"
shadowsocks = { version = "1.24", features = ["aead-cipher-2022"] }
boringtun = "0.7"
quinn = "0.11"
async-trait = "0.1"
bytes = "1.12"
toml = "0.8"
ratatui = "0.28"
crossterm = "0.28"
indicatif = "0.17"
dialoguer = "0.11"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
