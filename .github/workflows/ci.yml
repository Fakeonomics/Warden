name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt --check
      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test warden-core
        run: cargo test -p warden-core
      - name: Build workspace
        run: cargo build -p warden-core -p warden-app
