<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warden VPN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0a0e1a 0%, #1a1033 50%, #2a1a4a 100%); color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 3rem; }
        .logo { font-size: 2.5rem; font-weight: 700; background: linear-gradient(90deg, #10b981, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.03em; }
        .logo span { color: #6366f1; font-weight: 300; }
        .main-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 3rem; box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); }
        .connection-status { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; padding: 1.5rem; border-radius: 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,0.2); animation: pulse 2s infinite; }
        .status-dot.active { background: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.2); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .status-text { font-size: 1.1rem; font-weight: 500; }
        .connect-btn { width: 100%; padding: 1.5rem; font-size: 1.2rem; font-weight: 700; border-radius: 16px; border: none; background: linear-gradient(135deg, #10b981, #6366f1); color: white; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(16,185,129,0.3); }
        .connect-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(16,185,129,0.4); }
        .connect-btn:active { transform: translateY(0); }
        .connect-btn.disconnect { background: linear-gradient(135deg, #ef4444, #f97316); box-shadow: 0 10px 30px rgba(239,68,68,0.3); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
        .stat-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 1.25rem; }
        .stat-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 0.5rem; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #e2e8f0; }
        .protocol-badges { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
        .badge { padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 500; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .badge.active { background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(99,102,241,0.2)); border-color: rgba(16,185,129,0.3); color: #10b981; }
        .opsec-section { margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.05); }
        .opsec-section h2 { font-size: 1.25rem; margin-bottom: 1rem; color: #6366f1; }
        .opsec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
        .opsec-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .opsec-indicator { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
        .opsec-indicator.inactive { background: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Warden <span>VPN</span></div>
            <div style="font-size: 0.85rem; color: #64748b;">v0.1.0 · Rust · Multi-Protocol</div>
        </header>
        
        <main>
            <div class="main-card">
                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <div>
                        <div class="status-text" id="statusText">Disconnected</div>
                        <div style="font-size: 0.85rem; color: #64748b;" id="statusSubtext">Ready to connect</div>
                    </div>
                </div>
                
                <button class="connect-btn" id="connectBtn" onclick="toggleConnection()">
                    <span id="btnText">Connect</span>
                </button>
                
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-label">Protocol</div>
                        <div class="stat-value" id="currentProtocol">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Server</div>
                        <div class="stat-value" id="currentServer">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Latency</div>
                        <div class="stat-value" id="currentLatency">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Uptime</div>
                        <div class="stat-value" id="currentUptime">—</div>
                    </div>
                </div>
                
                <div class="opsec-section">
                    <h2>OPSec · Security Features</h2>
                    <div class="opsec-grid">
                        <div class="opsec-item">
                            <div class="opsec-indicator" id="indFp"></div>
                            <span>Fingerprint Rotation</span>
                        </div>
                        <div class="opsec-item">
                            <div class="opsec-indicator" id="indTraffic"></div>
                            <span>Traffic Shaping</span>
                        </div>
                        <div class="opsec-item">
                            <div class="opsec-indicator" id="indHwid"></div>
                            <span>HWID Spoof</span>
                        </div>
                        <div class="opsec-item">
                            <div class="opsec-indicator" id="indKill"></div>
                            <span>Kill Switch</span>
                        </div>
                        <div class="opsec-item">
                            <div class="opsec-indicator" id="indLeak"></div>
                            <span>DNS Leak Protection</span>
                        </div>
                        <div class="opsec-item">
                            <div class="opsec-indicator" id="indPadding"></div>
                            <span>Packet Padding</span>
                        </div>
                    </div>
                    <div class="protocol-badges" id="protocolBadges">
                        <span class="badge">WireGuard</span>
                        <span class="badge">VLESS</span>
                        <span class="badge">Shadowsocks</span>
                        <span class="badge">Hysteria2</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Tauri API interaction
        const { invoke } = window.__TAURI__.tauri;
        
        let isConnected = false;
        
        async function toggleConnection() {
            const btn = document.getElementById('connectBtn');
            const btnText = document.getElementById('btnText');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (!isConnected) {
                btnText.textContent = 'Connecting...';
                btn.disabled = true;
                
                try {
                    const result = await invoke('connect');
                    isConnected = true;
                    btn.classList.add('disconnect');
                    btnText.textContent = 'Disconnect';
                    statusDot.classList.add('active');
                    statusText.textContent = 'Connected · Protected';
                    document.getElementById('statusSubtext').textContent = `Session: ${result.session_id.slice(0, 8)}...`;
                    
                    // Update stats
                    document.getElementById('currentProtocol').textContent = result.protocol;
                    document.getElementById('currentServer').textContent = result.server;
                    document.getElementById('currentLatency').textContent = '24ms';
                    document.getElementById('currentUptime').textContent = 'Active';
                    
                    // Update protocol badges
                    document.querySelectorAll('.badge').forEach(b => b.classList.remove('active'));
                    document.querySelector(`[data-protocol="${result.protocol.toLowerCase()}"]`)?.classList.add('active');
                    
                } catch (e) {
                    btnText.textContent = 'Failed';
                    statusText.textContent = 'Connection Failed';
                    setTimeout(() => {
                        btnText.textContent = 'Connect';
                    }, 2000);
                } finally {
                    btn.disabled = false;
                }
            } else {
                btnText.textContent = 'Disconnecting...';
                btn.disabled = true;
                
                try {
                    await invoke('disconnect');
                    isConnected = false;
                    btn.classList.remove('disconnect');
                    btnText.textContent = 'Connect';
                    statusDot.classList.remove('active');
                    statusText.textContent = 'Disconnected';
                    document.getElementById('statusSubtext').textContent = 'Ready to connect';
                    
                    document.getElementById('currentProtocol').textContent = '—';
                    document.getElementById('currentServer').textContent = '—';
                    document.getElementById('currentLatency').textContent = '—';
                    document.getElementById('currentUptime').textContent = '—';
                    
                    document.querySelectorAll('.badge').forEach(b => b.classList.remove('active'));
                    
                } catch (e) {
                    console.error('Disconnect error:', e);
                } finally {
                    btn.disabled = false;
                }
            }
        }
        
        // Initialize OPsec status
        document.getElementById('indFp').className = 'opsec-indicator';
        document.getElementById('indTraffic').className = 'opsec-indicator';
        document.getElementById('indHwid').className = 'opsec-indicator';
        document.getElementById('indKill').className = 'opsec-indicator';
        document.getElementById('indLeak').className = 'opsec-indicator';
        document.getElementById('indPadding').className = 'opsec-indicator';
        
        // Auto-refresh status every 3 seconds
        setInterval(async () => {
            try {
                const status = await invoke('get_connection_status');
                if (status && status.type === 'Connected') {
                    if (!isConnected) {
                        isConnected = true;
                        document.getElementById('connectBtn').classList.add('disconnect');
                        document.getElementById('btnText').textContent = 'Disconnect';
                        document.getElementById('statusDot').classList.add('active');
                        document.getElementById('statusText').textContent = 'Connected · Protected';
                    }
                    document.getElementById('currentServer').textContent = status.server || '—';
                    document.getElementById('currentLatency').textContent = '24ms';
                    document.getElementById('currentUptime').textContent = `${status.uptime || 0}s`;
                } else if (status && status.type === 'Disconnected') {
                    if (isConnected) {
                        isConnected = false;
                        document.getElementById('connectBtn').classList.remove('disconnect');
                        document.getElementById('btnText').textContent = 'Connect';
                        document.getElementById('statusDot').classList.remove('active');
                        document.getElementById('statusText').textContent = 'Disconnected';
                    }
                    document.getElementById('currentServer').textContent = '—';
                    document.getElementById('currentLatency').textContent = '—';
                    document.getElementById('currentUptime').textContent = '—';
                }
            } catch (e) {
                // Ignore errors during refresh
            }
        }, 3000);
    </script>
</body>
</html>
